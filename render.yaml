services:
  # ─── Backend Web Service ─────────────────────────────────────────────────────
  - type: web
    name: redimvi-server
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    plan: free
    region: oregon

    envVars:
      - key: NODE_ENV
        value: production

      # Manually supply your existing Render PostgreSQL Internal Database URL here
      - key: DATABASE_URL
        sync: false

      # ⚠ CHANGE THESE in Render's dashboard after first deploy:
      - key: JWT_SECRET
        generateValue: true          # Render generates a secure random value

      # Set this to your Vercel frontend URL, e.g. https://redimvi.vercel.app
      - key: FRONTEND_URL
        sync: false                  # You'll enter the value manually in Render

    healthCheckPath: /api/health
